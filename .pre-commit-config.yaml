---
# Same repos and revs as the sibling repos in this workspace, so Renovate bumps
# them by the same rules.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # data/ grows with every ingest; a stray raw cache dump would bloat the
      # repo permanently.
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-crlf
      - id: remove-tabs

  # Deliberately NOT running fix-smartquotes: this repo stores Norwegian
  # curriculum text verbatim from Udir, and rewriting its punctuation would
  # silently fork us from the official wording.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows the sourced lib.sh; SC1091 ignores what it cannot resolve.
        args: [--external-sources, -e, SC1091]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-1
    hooks:
      - id: shfmt
        # -i 2: 2-space indent, -ci: indent case bodies, -s: simplify, -w: write
        args: [-i, "2", -ci, -s, -w]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tools|tests)/.*\.py$
      - id: ruff-format
        files: ^(src|tools|tests)/.*\.py$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # The committed catalogue is data, and data rots differently from code: a
      # re-ingest that silently drops a subject or orphans a goal code passes
      # every syntactic check. These tests are the gate for that.
      - id: catalogue-tests
        name: Validate the committed curriculum catalogue
        entry: uv run pytest tests/test_catalogue_data.py -q
        language: system
        files: ^(data/curriculum/|src/pensum/(domain|catalogue)/)
        pass_filenames: false

      # A new UI string added to bokmål but not English degrades silently at
      # runtime -- the English page quietly shows a Norwegian sentence. Nobody
      # files that bug, so it gets a deterministic check.
      - id: i18n-key-parity
        name: Check UI locale files have identical key sets
        entry: uv run python -m pensum.i18n.check
        language: system
        files: ^src/pensum/i18n/
        pass_filenames: false

      # An item can be perfectly well-formed and still reference a competence
      # goal that no longer exists -- which is exactly what a curriculum
      # revision produces. That failure is silent at runtime (the item simply
      # never gets selected), so it is made loud here.
      - id: validate-items
        name: Validate quiz items against the curriculum catalogue
        entry: uv run python -m pensum.items.validate
        language: system
        files: ^(data/(items|curriculum)/|src/pensum/items/)
        pass_filenames: false
