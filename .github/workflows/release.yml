---
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One-time manual step after the first release: GHCR packages start private and
# do NOT inherit visibility from the repository, so the package must be set to
# public by hand under Package settings -> Change visibility. There is no API or
# CLI for it. The repo is public and the image is meant to be pullable without
# credentials, so this is not optional -- and it cannot be undone once done.

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required to publish the image with a provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Conventional Commits decide the version. Nothing is hand-bumped, so a
      # release is a consequence of how commits were written.
      - name: Determine and apply the next version
        id: semver
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.semver.outputs.released == 'true'

      - uses: docker/login-action@v3
        if: steps.semver.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        if: steps.semver.outputs.released == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: push
        if: steps.semver.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: steps.semver.outputs.released == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
