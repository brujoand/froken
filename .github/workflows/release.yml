---
name: Release

on:
  push:
    branches: [main]
  # A release can fail for reasons unrelated to the commit -- a registry flake,
  # a rate limit. Re-running beats pushing an empty commit to retrigger.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# One-time manual step after the first release: GHCR packages start private and
# do NOT inherit visibility from the repository, so the package must be set to
# public by hand under Package settings -> Change visibility. There is no API or
# CLI for it. The repo is public and the image is meant to be pullable without
# credentials, so this is not optional -- and it cannot be undone once done.

jobs:
  # semantic-release reads the conventional commits since the last tag and
  # decides the version. It is the only thing that does: the image is tagged
  # with whatever it picks, so a release and its image can never disagree.
  #
  # Note the absence of @semantic-release/git -- nothing is committed back. main
  # is protected by a ruleset requiring a pull request, and a release should not
  # be an exception to it. The tag and the GitHub release are the record; the
  # repo is not rewritten to describe its own version.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release 2>&1 | tee release.log

          # semantic-release exits 0 whether or not it published, so the log is
          # what tells us which happened. grep must not kill the step when it
          # finds nothing -- that is the ordinary "no release needed" path.
          version="$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' release.log | tail -1 || true)"

          if [[ -n "${version}" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "released ${version}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"

            # A race, not a miss. When two commits land on main within seconds,
            # the earlier run reaches semantic-release after origin has already
            # advanced and aborts with "behind the remote one" instead of
            # publishing. The newer commit's run publishes a cumulative release
            # that ships this change too, so failing here would be a false red.
            if grep -q 'behind the remote' release.log; then
              echo "superseded by a newer push to main; its run publishes this change"
              exit 0
            fi

            echo "no release warranted by these commits"

            # ...but if the app changed and no release came out, that is not a
            # quiet no-op, it is a silent one. No release means no image, which
            # means the change can never reach a cluster pinned to a version.
            #
            # A backstop, not the gate. CI runs the same check on the pull
            # request, where it can still be acted on; by the time this fires
            # the commit is already on main and needs a second one to repair.
            git diff --name-only HEAD~1 HEAD > /tmp/changed-paths
            git log -1 --pretty=%B HEAD > /tmp/commit-message
            if ! ./bin/release_required /tmp/changed-paths /tmp/commit-message; then
              echo "::error::A change to the app produced no release, so no image was built and it cannot deploy. See the message above."
              exit 1
            fi
          fi

  # No release, no image: every published tag corresponds to a GitHub release.
  publish:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brujoand/pensum
          # No `latest`: a deployment should name the version it wants, and a
          # moving tag makes that impossible to do honestly. metadata-action
          # adds `latest` alongside any semver tag unless told not to, so this
          # flavor line is what actually suppresses it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=sha,format=long

      # A push to GHCR intermittently dies with "unknown blob" -- a transient
      # registry flake rather than a build problem, and one that can cost a
      # release its image while the tag and GitHub release still exist. So the
      # push gets one retry: the first attempt may fail, and an identical second
      # runs only if it did. A persistent error still fails the job. The two
      # `with` blocks are deliberately identical and MUST stay in sync; GitHub
      # Actions has no YAML anchors to share them.
      - name: Build and push
        id: buildpush
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same version the image is TAGGED with, baked in so it can say
          # out loud what it is. One source, so the version the app reports and
          # the tag in the registry cannot drift apart.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

      - name: Build and push (retry)
        if: steps.buildpush.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
