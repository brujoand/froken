---
name: Release

# Deliberately NOT `push: [main]`. CI triggers on that push, and a release
# triggered on the same event runs beside CI rather than after it -- so a commit
# whose container had already been shown not to start was tagged, built, pushed
# and dispatched to the deployment repo while CI was still going red about it.
# That is not hypothetical: it is v1.12.0.
#
# `workflow_run` fires when CI *finishes*, and carries its conclusion. So the
# question this workflow asks first is no longer "did something land on main"
# but "did something land on main that works".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A release can fail for reasons unrelated to the commit -- a registry flake,
  # a rate limit. Re-running beats pushing an empty commit to retrigger, and it
  # is the one path that does not consult CI: a human asking for it has already
  # decided.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# One-time manual step after the first release: GHCR packages start private and
# do NOT inherit visibility from the repository, so the package must be set to
# public by hand under Package settings -> Change visibility. There is no API or
# CLI for it. The repo is public and the image is meant to be pullable without
# credentials, so this is not optional -- and it cannot be undone once done.

# The commit CI actually tested. Every checkout below pins it rather than taking
# whatever main happens to be, so the thing that is tagged, built and deployed is
# the thing that passed -- even if another push landed in between.
env:
  VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Said out loud rather than left as a workflow run full of skipped jobs.
  # "Nothing was released" and "nothing needed releasing" look identical in the
  # Actions list, and they are very different facts about main.
  blocked:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      # A warning rather than a failure: CI has already gone red about this
      # commit, and a second red run reports the same fact twice while making
      # the release history look like the thing that is broken.
      #
      # 'cancelled' lands here too and is usually routine: CI cancels a run in
      # progress when a second push arrives, and that newer push carries this
      # change into its own release. Which is why the wording names the
      # conclusion instead of asserting that something is wrong.
      - name: Say why nothing shipped
        run: |
          set -euo pipefail
          conclusion='${{ github.event.workflow_run.conclusion }}'
          sha='${{ github.event.workflow_run.head_sha }}'
          echo "::warning::CI concluded '${conclusion}' for ${sha}, so no release was cut and no image was published. Fix main, or re-run this workflow by hand if you are certain."
          {
            echo "## No release"
            echo
            echo "CI concluded \`${conclusion}\` for \`${sha}\`."
            echo
            echo "Nothing was tagged, built or deployed."
          } >> "$GITHUB_STEP_SUMMARY"

  # semantic-release reads the conventional commits since the last tag and
  # decides the version. It is the only thing that does: the image is tagged
  # with whatever it picks, so a release and its image can never disagree.
  #
  # Note the absence of @semantic-release/git -- nothing is committed back. main
  # is protected by a ruleset requiring a pull request, and a release should not
  # be an exception to it. The tag and the GitHub release are the record; the
  # repo is not rewritten to describe its own version.
  version:
    # The gate. A manual dispatch is exempt; everything else waits for a verdict
    # and only proceeds on a good one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.VERIFIED_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release 2>&1 | tee release.log

          # semantic-release exits 0 whether or not it published, so the log is
          # what tells us which happened. grep must not kill the step when it
          # finds nothing -- that is the ordinary "no release needed" path.
          version="$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' release.log | tail -1 || true)"

          if [[ -n "${version}" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "released ${version}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"

            # A race, not a miss. When two commits land on main within seconds,
            # the earlier run reaches semantic-release after origin has already
            # advanced and aborts with "behind the remote one" instead of
            # publishing. The newer commit's run publishes a cumulative release
            # that ships this change too, so failing here would be a false red.
            if grep -q 'behind the remote' release.log; then
              echo "superseded by a newer push to main; its run publishes this change"
              exit 0
            fi

            echo "no release warranted by these commits"

            # ...but if the app changed and no release came out, that is not a
            # quiet no-op, it is a silent one. No release means no image, which
            # means the change can never reach a cluster pinned to a version.
            #
            # A backstop, not the gate. CI runs the same check on the pull
            # request, where it can still be acted on; by the time this fires
            # the commit is already on main and needs a second one to repair.
            git diff --name-only HEAD~1 HEAD > /tmp/changed-paths
            git log -1 --pretty=%B HEAD > /tmp/commit-message
            if ! ./bin/release_required /tmp/changed-paths /tmp/commit-message; then
              echo "::error::A change to the app produced no release, so no image was built and it cannot deploy. See the message above."
              exit 1
            fi
          fi

  # No release, no image: every published tag corresponds to a GitHub release.
  publish:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The same commit `version` released, not the tip of main: a push that
      # landed while this was running must not end up inside an image labelled
      # with the older version.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action fills org.opencontainers.image.description from the
      # GitHub repository description, which is a field nothing in this repo
      # controls and which still carried the project's old name for a week
      # after the rename. pyproject.toml already states what this is, is
      # reviewed like any other file, and cannot drift from a release without
      # somebody editing it -- so it is the source, and the label follows it.
      - name: Read the project description
        id: describe
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              described = tomllib.load(handle)["project"]["description"]
          # Single line by construction; a newline here would silently truncate
          # the step output and label the image with half a sentence.
          assert "\n" not in described, "the project description must be one line"
          print(f"description={described}")
          PY

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brujoand/pensum
          # Overrides the repository-description default above.
          labels: |
            org.opencontainers.image.description=${{ steps.describe.outputs.description }}
          # No `latest`: a deployment should name the version it wants, and a
          # moving tag makes that impossible to do honestly. metadata-action
          # adds `latest` alongside any semver tag unless told not to, so this
          # flavor line is what actually suppresses it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=sha,format=long

      # A push to GHCR intermittently dies with "unknown blob" -- a transient
      # registry flake rather than a build problem, and one that can cost a
      # release its image while the tag and GitHub release still exist. So the
      # push gets one retry: the first attempt may fail, and an identical second
      # runs only if it did. A persistent error still fails the job. The two
      # `with` blocks are deliberately identical and MUST stay in sync; GitHub
      # Actions has no YAML anchors to share them.
      - name: Build and push
        id: buildpush
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same version the image is TAGGED with, baked in so it can say
          # out loud what it is. One source, so the version the app reports and
          # the tag in the registry cannot drift apart.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

      - name: Build and push (retry)
        id: buildpush_retry
        if: steps.buildpush.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

      # Ask the deployment repo to pin what was just published, so the deploy PR
      # opens now instead of whenever something next polls the registry. This
      # image is public, so Renovate would find it within the hour regardless --
      # this turns "some time today" into "now", it is not the only path.
      #
      # Two earlier designs failed and both are why this goes OUTBOUND. GitHub's
      # own `registry_package` webhook once delivered two releases ~40 minutes
      # late and in the WRONG ORDER, pinning a deployment backwards. Posting
      # straight at a receiver fixed ordering but could not connect: the
      # firewall admitted that endpoint only from GitHub's `hooks` egress
      # ranges, while a release job runs from the `actions` ranges -- disjoint
      # sets, so every POST was dropped. Reaching api.github.com needs no
      # inbound path at all, and ordering holds because the dispatch happens
      # after the push it reports.
      #
      # Both the token and the REPOSITORY NAME come from secrets, and the repo
      # name is a secret specifically because this repository is public. The
      # other repos wired this way are private and name their target inline;
      # doing that here would publish the existence and name of a private repo
      # to anyone reading this file, which is not undoable once indexed. Secrets
      # are also masked in logs, which repository variables are not -- and the
      # logs of a public repo are public too.
      #
      # The digest travels as an input rather than being looked up at the other
      # end, so the pin can never name a different build from the one this job
      # pushed.
      - name: Dispatch the deploy bump
        env:
          # A fine-grained PAT scoped `actions: write` on the deployment repo
          # and nothing else: enough to start one workflow there, not enough to
          # write a file, push a branch, or read a secret.
          GH_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
          DEPLOY_REPO: ${{ secrets.RELEASE_BUMP_REPO }}
          # Derived from the environment rather than the event payload, which
          # differs in shape between a push, a workflow_run and a dispatch --
          # an empty app name here would pin nothing, quietly.
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.version }}
          # Whichever push attempt actually landed. A skipped step has no
          # outputs, so `||` picks the retry only when the first produced
          # nothing.
          DIGEST: ${{ steps.buildpush.outputs.digest || steps.buildpush_retry.outputs.digest }}
        run: |
          set -euo pipefail
          APP="${REPOSITORY##*/}"

          # Not configured is not a failure. The image is published and Renovate
          # will pick it up; saying so is more useful than a red release.
          if [ -z "${GH_TOKEN}" ] || [ -z "${DEPLOY_REPO}" ]; then
            echo "::warning::RELEASE_BUMP_TOKEN or RELEASE_BUMP_REPO is unset, so nothing was told to deploy ${TAG}. Renovate will still find it within the hour, or pin it now with 'lab bump ${APP} ${TAG} --digest ${DIGEST}'."
            exit 0
          fi
          if [ -z "${DIGEST}" ]; then
            echo "::error::neither push step produced a digest, so there is nothing to pin."
            exit 1
          fi

          # Retried by hand: `gh workflow run` has no retry of its own, and a
          # dropped dispatch means a published image that nothing deploys.
          for attempt in 1 2 3 4 5; do
            if gh workflow run release-bump.yml \
              --repo "${DEPLOY_REPO}" \
              --ref main \
              -f "app=${APP}" \
              -f "tag=${TAG}" \
              -f "digest=${DIGEST}"; then
              echo "asked the deployment repo to pin ${APP} ${TAG} (${DIGEST})"
              exit 0
            fi
            echo "::warning::dispatch attempt ${attempt} failed"
            sleep 5
          done

          echo "::error::could not dispatch the deploy bump after 5 attempts. The image is published but unpinned; pin it with 'lab bump ${APP} ${TAG} --digest ${DIGEST}'."
          exit 1
