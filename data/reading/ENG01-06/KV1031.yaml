texts:
  - id: eng-kv1031-sock-monster
    goal: KM13347
    language: en
    title: The Sock Monster
    difficulty: 1
    source: pensum
    reviewed: false
    body: |
      There is a monster under my bed, and all it eats is socks.
      It never takes a pair. It only ever takes one, which I think is the
      rudest part of the whole thing.
      I have tried leaving it a whole clean pair as a gift. In the morning
      there was one sock left, and a small note that said: no thank you, I
      only like the lonely ones.
      My mother says the socks are in the washing machine. I have looked in
      the washing machine. There is nothing in there but water and lies.

  - id: eng-kv1031-grandpa-robot
    goal: KM13347
    language: en
    title: Grandpa's Terrible Robot
    difficulty: 2
    source: pensum
    reviewed: false
    body: |
      My grandpa built a robot in his garage. It took him two years, and it can
      do one thing.
      It can pass the salt.
      It cannot pass the pepper. We asked. Grandpa says that would be a
      completely different machine.
      The robot is the size of a fridge and it makes a sound like a tractor
      falling down some stairs, but if you sit at the table and say "salt,
      please", it will hand you the salt in under nine seconds.
      Grandma says it was a waste of two years. Grandpa says she has not passed
      the salt once since it was finished, so who is really winning here.
