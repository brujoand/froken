texts:
  - id: eng-kv1033-the-cost-of-attention
    goal: KM13377
    language: en
    title: The Cost of Attention
    difficulty: 1
    source: pensum
    reviewed: false
    body: |
      Anything given away for free is paid for somewhere, and in the case of
      most of what we read on a screen, the payment is attention. That is not a
      metaphor. Attention is finite, it can be measured, and there is an
      industry whose entire business is buying and selling it in bulk.
      What makes this awkward is that the product being optimised is not the
      article, the video or the conversation. It is the length of time you stay.
      A system rewarded for holding attention will, given enough iterations,
      discover that outrage holds it better than agreement and that certainty
      holds it better than doubt. No one has to intend this for it to happen;
      it is simply what the measurement selects for.
      The usual response is to blame the people who keep scrolling, which is
      both easy and beside the point. A more useful question is what a system
      would look like if it were rewarded for something else entirely: for
      whether you were glad, an hour later, that you had spent the time.

  - id: eng-kv1033-a-borrowed-word
    goal: KM13377
    language: en
    title: A Borrowed Word
    difficulty: 2
    source: pensum
    reviewed: false
    body: |
      English has never been shy about taking words from other languages, and
      Norwegian is among the languages it has taken from. The everyday verbs
      that arrived with Norse settlers a thousand years ago are so thoroughly
      naturalised that no one hears them as foreign: take, give, get, want,
      call, knife, sky, egg, window.
      Borrowing on this scale is unusual. Languages more often take nouns for
      things they did not previously have, which is why words for food, music
      and technology travel so easily. Basic verbs and pronouns are supposed to
      be resistant, which tells us something about how close the contact must
      have been.
      Traffic now runs mainly the other way. Norwegian teenagers use English
      words their grandparents did not have, and language councils publish
      alternatives that are sometimes adopted and more often quietly ignored.
      Whether this represents loss or ordinary change is a question people
      answer largely according to what they already believed about the matter.
