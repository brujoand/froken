# Høytlesing, norsk etter 2. trinn (NOR01-08 / KV1107).
#
# Tekstene er skrevet for Pensum. De er korte, har korte setninger og bruker ord
# en sjuåring har møtt før — en høytlesingstekst skal måle flyt, ikke ordforråd.
#
# Og de er tullete med vilje. En elev som ler av teksten leser den en gang til,
# og det er hele poenget med øvingen. Ingenting her er hentet fra læreplanen.
