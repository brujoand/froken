# Høytlesing, norsk etter 10. trinn (NOR01-08 / KV1110).
#
# Voksen setningsbygning, abstrakte begreper og innskutte setninger. En elev som
# holder flyten gjennom disse, leser høyt omtrent som en voksen gjør. Skrevet
# for Pensum.
---
subject: NOR01-08
goal_set: KV1110

texts:
  - id: nor-kv1110-allmenningen
    goal: KM14193
    language: nb
    title: Det ingen eier
    difficulty: 1
    source: pensum
    reviewed: false
    body: |
      Et gammelt spørsmål i samfunnsfaget lyder omtrent slik: hva skjer med noe
      som tilhører alle, og som ingen har et særskilt ansvar for? Den klassiske
      illustrasjonen er en felles beitemark. For hver enkelt bonde lønner det
      seg å slippe ut én ku til, siden gevinsten er hans alene, mens slitasjen
      fordeles på alle. Følger alle den samme logikken, blir marken beitet ned,
      og til slutt taper alle sammen.
      Innvendingen mot fortellingen er at den beskriver en allmenning uten
      regler, og at slike sjelden har eksistert. Der folk faktisk har delt en
      ressurs over lang tid, har de som regel også laget seg ordninger for
      hvem som kan bruke hva, når, og hva som skjer med den som bryter
      avtalen. Det er ikke eierskapet i seg selv som avgjør utfallet, men om
      det finnes en felles forståelse som blir håndhevet.
      Poenget er ikke bare historisk. Fiskebestander, grunnvann og ren luft er
      alle ressurser der den enkeltes regnestykke og fellesskapets regnestykke
      peker i hver sin retning, og der spørsmålet om hvem som skal håndheve hva,
      fortsatt er ubesvart.

  - id: nor-kv1110-oversettelsen
    goal: KM14193
    language: nb
    title: Det som forsvinner i oversettelsen
    difficulty: 2
    source: pensum
    reviewed: false
    body: |
      Enhver oversettelse er et valg, og valget er sjelden mellom rett og galt.
      En oversetter som holder seg tett til originalens ordstilling, risikerer
      å levere setninger som er formelt korrekte, men som ingen ville sagt på
      norsk. En som skriver seg fri, får en tekst som leser lett, men som
      kanskje har mistet nettopp det som gjorde originalen verdt å oversette.
      Vanskeligst blir det når forfatteren har lagt inn en dobbelthet som ikke
      finnes i målspråket. Et ord som på engelsk bærer to betydninger samtidig,
      må gjerne deles i to på norsk, og da må oversetteren bestemme seg for
      hvilken av dem leseren skal få se. Fotnoter hjelper lite; en vits som må
      forklares, er allerede ødelagt.
      Derfor sier man iblant at en oversettelse har en holdbarhetsdato som
      originalen ikke har. Kildeteksten står der den står, mens språket den er
      overført til, flytter seg. Hver generasjon leser den forrige
      generasjonens oversettelse og synes den er litt stiv — og setter seg,
      før eller siden, til å gjøre arbeidet en gang til.
