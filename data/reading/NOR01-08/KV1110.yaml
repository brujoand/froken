# Høytlesing, norsk etter 10. trinn (NOR01-08 / KV1110).
#
# Voksen setningsbygning, byråkratisk register og innskutte setninger. En elev
# som holder flyten gjennom disse, leser høyt omtrent som en voksen gjør — og
# vitsen ligger nettopp i den tørre tonen, så teksten må leses ordentlig for å
# være morsom. Skrevet for Pensum.
---
subject: NOR01-08
goal_set: KV1110

texts:
  - id: nor-kv1110-klagebrev
    goal: KM14193
    language: nb
    title: Klagebrev fra en drage
    difficulty: 1
    source: pensum
    reviewed: false
    body: |
      Til kommunen. Jeg viser til vedtak av 14. mars om reguleringen av
      fjellsiden ovenfor bygda, og ønsker med dette å påklage det i sin helhet.
      Innledningsvis vil jeg presisere at jeg har holdt til i denne hulen i noe
      i overkant av ni hundre år. Det er min oppfatning at dette utgjør en
      hevdvunnen rett, og jeg registrerer at kommunen i saksfremlegget omtaler
      meg som «forhold av midlertidig karakter».
      Videre bemerkes det at planen forutsetter sprengning. Jeg har ingen
      innvendinger mot sprengning i seg selv, som jeg driver med daglig, men
      det bør være åpenbart for enhver at to parter som sprenger i samme
      fjellside samtidig, ikke er en hensiktsmessig løsning for noen.
      Når det gjelder påstanden om at jeg skal ha fortært to sauer i juni, vil
      jeg understreke at dette gjaldt én sau, at den var syk, og at jeg forsøkte
      å kontakte eieren først. Eieren la på.
      Avslutningsvis vil jeg minne om at jeg i førti år har varmet
      svømmehallen vederlagsfritt. Jeg ber om at dette tas i betraktning.
      Jeg imøteser deres svar innen fristen, og gjør oppmerksom på at jeg leser
      all post umiddelbart, ettersom jeg brenner den etterpå.

  - id: nor-kv1110-usynlig
    goal: KM14193
    language: nb
    title: Bruksanvisning for å være usynlig
    difficulty: 2
    source: pensum
    reviewed: false
    body: |
      Les hele bruksanvisningen før du tar produktet i bruk. Produsenten
      fraskriver seg ethvert ansvar for skader som oppstår fordi brukeren ble
      utålmodig på side én.
      Usynlighet aktiveres ved å holde pusten og mene det. Å mene det er den
      vanskelige delen, og de fleste feilene brukere melder inn, skyldes at de
      egentlig ikke gjorde det. Delvis usynlighet, altså en usynlig person med
      fullt synlige ører, er den vanligste konsekvensen av halvhjertethet.
      Vær oppmerksom på at klær ikke omfattes. Dette er en velkjent begrensning
      ved teknologien, og produsenten anser den for å være brukerens problem.
      Vi anbefaler planlegging.
      Usynlighet oppheves automatisk ved nys, ved latter, og ved å bli tiltalt
      ved fullt navn av en person med myndighet over deg. Sistnevnte kan ikke
      slås av, og er lagt inn med hensikt.
      Produktet egner seg ikke til bruk i trafikken, i svømmehaller, eller til å
      overvære samtaler du senere må late som du ikke har hørt. Erfaring viser
      at brukere som ignorerer dette punktet, gjennomgående angrer innen en uke.
      Ved feil, kontakt oss. Vi er ikke vanskelige å finne. Vi er bare veldig
      vanskelige å se.
