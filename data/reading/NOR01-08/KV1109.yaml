# Høytlesing, norsk etter 7. trinn (NOR01-08 / KV1109).
#
# Lengre perioder, innskutte setninger og en og annen fagaktig vending — på
# dette trinnet skal eleven holde flyten gjennom en tekst som ikke er skrevet
# for å være lett. At den er tullete gjør den ikke enklere å lese høyt; det gjør
# bare at eleven vil lese den ferdig. Skrevet for Pensum.
