# Letterforms: how each letter, and each digit, is drawn.
#
# One glyph per entry, one *stroke* per path. A stroke is a movement rather than
# a shape -- where it starts and which way it runs is half of what a first-grader
# is learning -- so the order of the list is the order the strokes are written,
# and the direction of each path is the direction the pen goes.
#
# The forms are print letters (formskrift), not løkkeskrift: that is what
# Norwegian schools teach first, and it is the one a finger on glass can
# actually produce. They are drawn on a 100 by 140 grid whose four writing lines
# are named under `metrics` below, so the page can rule the paper from the same
# numbers the letters were built on.
#
# Nothing here comes from the curriculum. LK20 says a pupil should write "med
# funksjonell håndskrift" and names no letterform at all; these are ours, and a
# school that teaches a different `a` is not being contradicted by this file.
#
# Check a change with `tools/render_alphabet.py`, which prints every glyph as
# ASCII with its stroke order marked. A letterform is reviewed by looking at it.
---
