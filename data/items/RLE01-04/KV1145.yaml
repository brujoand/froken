  - id: KM14620-02
    goal: KM14620
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: >-
        Norsk straffelov har en egen bestemmelse om hatefulle ytringer. Hva må
        en ytring rette seg mot for å rammes av den?
      en: >-
        Norwegian criminal law has a specific provision on hate speech. What
        must an utterance target to fall under it?
    choices:
      - id: a
        text:
          nb: >-
            Noen på grunn av hudfarge eller opprinnelse, religion eller
            livssyn, seksuell orientering, kjønnsidentitet eller nedsatt
            funksjonsevne
          en: >-
            Someone because of skin colour or origin, religion or belief,
            sexual orientation, gender identity or disability
        correct: true
      - id: b
        text:
          nb: Hvilken som helst person som blir lei seg av ytringen
          en: Any person who is made sad by the utterance
      - id: c
        text:
          nb: Bare offentlige personer som politikere og journalister
          en: Only public figures such as politicians and journalists
    explanation:
      nb: >-
        Straffeloven paragraf 185 rammer ytringer som truer eller håner noen ut
        fra bestemte kjennetegn, blant annet hudfarge, opprinnelse, religion,
        seksuell orientering, kjønnsidentitet og funksjonsevne. Terskelen er
        høy: å være uenig, eller å si noe andre blir lei seg av, er ikke i seg
        selv straffbart i Norge.
      en: >-
        Section 185 of the Criminal Code covers utterances that threaten or
        deride someone on the basis of specified characteristics, including
        skin colour, origin, religion, sexual orientation, gender identity and
        disability. The threshold is high: disagreeing, or saying something
        that upsets someone, is not in itself a crime in Norway.
    reviewed: false

  # KM14621 -- menneskerettigheter, bærekraft og fattigdom
  - id: KM14621-01
    goal: KM14621
    type: multiple_choice
