  - id: KM14621-02
    goal: KM14621
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: >-
        Brundtland-kommisjonen ga i 1987 en mye brukt definisjon av bærekraftig
        utvikling. Hva går den ut på?
      en: >-
        In 1987 the Brundtland Commission gave a widely used definition of
        sustainable development. What does it say?
    choices:
      - id: a
        text:
          nb: >-
            Utvikling som dekker dagens behov uten å ødelegge mulighetene for
            at kommende generasjoner skal få dekket sine
          en: >-
            Development that meets the needs of the present without
            compromising the ability of future generations to meet theirs
        correct: true
      - id: b
        text:
          nb: Utvikling som gir høyest mulig økonomisk vekst hvert år
          en: Development that produces the highest possible economic growth each year
      - id: c
        text:
          nb: Utvikling som bare foregår i de fattigste landene
          en: Development that takes place only in the poorest countries
    explanation:
      nb: >-
        Definisjonen kom i rapporten "Vår felles framtid" fra 1987, ledet av
        Gro Harlem Brundtland. Den knytter miljø, økonomi og sosiale forhold
        sammen, og den etiske kjernen er ansvaret for mennesker som ennå ikke
        er født.
      en: >-
        The definition comes from the 1987 report "Our Common Future", chaired
        by Gro Harlem Brundtland. It ties environment, economy and social
        conditions together, and its ethical core is responsibility towards
        people not yet born.
    reviewed: false

# Goals that no written question can honestly test, and goals where a question
# would have to take a side on something no quiz should decide for a child.
not_assessable:
  - goal: KM14618
    reason: >-
      Asks the pupil to explore other people's perspectives and to handle
      disagreement and the clash of opinions. This is a way of acting towards
      other people, practised in conversation over time. A written question
      could only ask what the pupil says they would do, which tests neither the
      skill nor any knowledge, and would reward the answer the pupil thinks the
      test wants.

  - goal: KM14619
    reason: >-
      Asks the pupil to reflect on existential questions about growing up and
      living in a diverse and global society. The substance of the goal is the
      pupil's own reflection on meaning, belonging and identity. There is no
      correct answer to mark, and marking one would amount to telling a child
      what to conclude about their own life and beliefs.
