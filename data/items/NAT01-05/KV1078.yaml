        signalsystemer?
      en: How do drugs, medicines and doping substances act on the body's
        signalling systems?
    choices:
      - id: a
        text:
          nb: De etterligner eller forstyrrer kroppens egne signalstoffer
          en: They mimic or interfere with the body's own signalling substances
        correct: true
      - id: b
        text:
          nb: De virker bare på musklene, ikke på signalstoffene
          en: They act only on the muscles, not on signalling substances
      - id: c
        text:
          nb: De endrer arvestoffet i alle cellene
          en: They change the DNA in every cell
    explanation:
      nb: Nerveceller snakker sammen med signalstoffer som binder seg til
        reseptorer. Mange rusmidler og legemidler ligner nok på disse stoffene
