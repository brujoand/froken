# Naturfag, kompetansemål etter 10. trinn (NAT01-05 / KV1078).
#
# Questions here are ours, not Udir's. The competence goals they test are quoted
# verbatim elsewhere; nothing in this file is official curriculum text.
#
# Written for 13-15-year-olds: normal prose, still plain. Goals about health,
# sexuality and climate are tested on settled science only, and stated as fact
# without moralising. Goals whose substance is the pupil's own discussion,
# practical investigation or programming are recorded under not_assessable.
---
subject: NAT01-05
goal_set: KV1078

items:
  - id: KM13854-01
    goal: KM13854
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: En elev vil finne ut om planter vokser raskere med mer lys. Hun setter
        like planter i ulik avstand fra en lampe og måler høyden etter to uker.
        Hva er den uavhengige variabelen?
      en: A pupil wants to find out whether plants grow faster with more light.
        She puts identical plants at different distances from a lamp and
        measures their height after two weeks. What is the independent variable?
    choices:
      - id: a
        text:
          nb: Mengden lys plantene får
          en: The amount of light the plants get
        correct: true
      - id: b
        text:
          nb: Høyden på plantene etter to uker
          en: The height of the plants after two weeks
      - id: c
        text:
          nb: Hvor mye vann plantene får
          en: How much water the plants get
    explanation:
      nb: Den uavhengige variabelen er den forskeren selv endrer på. Her er det
        lysmengden. Høyden er den avhengige variabelen, altså det som måles,
        og vannmengden holdes lik for alle plantene.
      en: The independent variable is the one the investigator changes on
        purpose - here the amount of light. Height is the dependent variable,
        the thing being measured, and watering is kept the same for all plants.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13854-02
    goal: KM13854
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilken av disse er formulert som en hypotese som kan testes?
      en: Which of these is stated as a hypothesis that can be tested?
    choices:
      - id: a
        text:
          nb: Salt vann fryser ved lavere temperatur enn ferskvann
          en: Salt water freezes at a lower temperature than fresh water
        correct: true
      - id: b
        text:
          nb: Vinter er den fineste årstiden
          en: Winter is the nicest season
      - id: c
        text:
          nb: Hvorfor blir vann til is?
          en: Why does water turn into ice?
    explanation:
      nb: En hypotese er en påstand som kan vise seg å være feil når vi måler.
        Alternativ a kan testes med et termometer. Alternativ b er en mening,
        og alternativ c er et spørsmål, ikke en påstand.
      en: A hypothesis is a claim that measurement could show to be wrong.
        Option a can be tested with a thermometer. Option b is an opinion and
        option c is a question, not a claim.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13855-01
    goal: KM13855
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: To elever måler hvor fort en isbit smelter, men gjør bare én måling
        hver. De får svært ulike svar. Hva er den beste måten å bedre kvaliteten
        på undersøkelsen?
      en: Two pupils measure how fast an ice cube melts, but each takes only one
        measurement. They get very different answers. What is the best way to
        improve the quality of the investigation?
    choices:
      - id: a
        text:
          nb: Gjenta målingen flere ganger under like forhold
          en: Repeat the measurement several times under the same conditions
        correct: true
      - id: b
        text:
          nb: Velge den målingen som passer best med det de trodde
          en: Pick whichever measurement best fits what they expected
      - id: c
        text:
          nb: Skrive resultatet med flere desimaler
          en: Write the result with more decimal places
    explanation:
      nb: Enkeltmålinger kan slå tilfeldig ut. Flere målinger under like forhold
        viser hvor mye resultatet varierer, og gir et sikrere gjennomsnitt. Å
        velge bort data som ikke passer, er ikke forskning, og flere desimaler
        gjør ikke en usikker måling sikrere.
      en: A single measurement can come out oddly by chance. Repeating under the
        same conditions shows how much the result varies and gives a more
        reliable average. Discarding data that does not fit is not science, and
        extra decimals do not make an uncertain measurement more certain.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13856-01
    goal: KM13856
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: En modell av solsystemet i klasserommet viser planetene som kuler på
        pinner. Hva er den viktigste begrensningen ved en slik modell?
      en: A classroom model of the solar system shows the planets as balls on
        sticks. What is the most important limitation of such a model?
    choices:
      - id: a
        text:
          nb: Avstandene og størrelsene er ikke i riktig forhold til hverandre
          en: The distances and sizes are not in the right proportion
        correct: true
      - id: b
        text:
          nb: Den viser at planetene går rundt sola
          en: It shows that the planets orbit the sun
      - id: c
        text:
          nb: Den er laget av andre materialer enn planetene
          en: It is made of different materials than the planets
    explanation:
      nb: En modell forenkler. Denne får fram rekkefølgen og banene, men
        avstandene i verdensrommet er så enorme at de ikke kan vises i riktig
        skala i et klasserom. At planetene går rundt sola er en styrke ved
        modellen, ikke en svakhet.
      en: A model simplifies. This one captures the order and the orbits, but the
        distances in space are so vast they cannot be shown to scale in a
        classroom. Showing the planets orbiting the sun is a strength of the
        model, not a weakness.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13859-01
    goal: KM13859
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: I en trådløs mikrofon som brukes på en skolescene, hva er senderen og
        hva er mottakeren?
      en: In a wireless microphone used on a school stage, what is the
        transmitter and what is the receiver?
    choices:
      - id: a
        text:
          nb: Mikrofonen sender, og mottakeren ved høyttaleranlegget mottar
          en: The microphone transmits, and the receiver by the speaker system
            picks it up
        correct: true
      - id: b
        text:
          nb: Høyttaleren sender, og mikrofonen mottar
          en: The loudspeaker transmits and the microphone receives
      - id: c
        text:
          nb: Begge deler sender, og ingen mottar
          en: Both transmit and neither receives
    explanation:
      nb: Et sender-mottaker-system trenger noe som gjør informasjon om til et
        signal, og noe som fanger opp signalet og gjør det om igjen. Mikrofonen
        gjør lyd om til et radiosignal, og mottakeren gjør signalet om til lyd i
        høyttaleren.
      en: A transmitter-receiver system needs something that turns information
        into a signal and something that picks the signal up and converts it
        back. The microphone turns sound into a radio signal, and the receiver
        turns the signal back into sound in the loudspeaker.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13861-01
    goal: KM13861
    type: numeric
    difficulty: 2
    prompt:
      nb: I en lukket beholder reagerer 4 gram hydrogen med 32 gram oksygen og
        danner vann. Hvor mange gram vann blir det?
      en: In a sealed container, 4 grams of hydrogen react with 32 grams of
        oxygen to form water. How many grams of water are produced?
    answer: 36
    explanation:
      nb: Masse blir verken borte eller til i en kjemisk reaksjon. Atomene blir
        bare satt sammen på nye måter, så massen av produktene er lik massen av
        det som reagerte, altså 4 + 32 = 36 gram.
      en: Mass is neither lost nor created in a chemical reaction. The atoms are
        just rearranged, so the mass of the products equals the mass of the
        reactants, 4 + 32 = 36 grams.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13861-02
    goal: KM13861
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilke stoffer dannes når rent metan brenner med rikelig oksygen?
      en: Which substances are formed when pure methane burns with plenty of
        oxygen?
    choices:
      - id: a
        text:
          nb: Karbondioksid og vann
          en: Carbon dioxide and water
        correct: true
      - id: b
        text:
          nb: Bare karbondioksid
          en: Carbon dioxide only
      - id: c
        text:
          nb: Hydrogen og oksygen
          en: Hydrogen and oxygen
    explanation:
      nb: Metan består av karbon og hydrogen. Ved fullstendig forbrenning binder
        karbonet seg til oksygen og blir karbondioksid, mens hydrogenet binder
        seg til oksygen og blir vann.
      en: Methane is made of carbon and hydrogen. In complete combustion the
        carbon combines with oxygen to form carbon dioxide, and the hydrogen
        combines with oxygen to form water.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13861-03
    goal: KM13861
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: Stålull veies, brennes i luft og veies igjen. Vekta har økt. Betyr
        det at massebevaring ikke gjelder?
      en: A piece of steel wool is weighed, burned in air, and weighed again. It
        has gained mass. Does this mean mass conservation does not hold?
    choices:
      - id: a
        text:
          nb: Nei, jernet har bundet oksygen fra lufta, og den massen kom med
          en: No, the iron has bound oxygen from the air, and that mass came with
            it
        correct: true
      - id: b
        text:
          nb: Ja, forbrenning lager ny masse
          en: Yes, burning creates new mass
      - id: c
        text:
          nb: Nei, vekta viser feil når noe er varmt
          en: No, scales read wrong when something is hot
    explanation:
      nb: Massebevaring gjelder for alle stoffene som er med i reaksjonen, også
        gassene. Jernet reagerer med oksygen fra lufta, og oksygenatomene blir
        værende i det nye stoffet. Da veier asken mer enn stålulla gjorde.
      en: Mass conservation covers every substance taking part, gases included.
        The iron reacts with oxygen from the air, and those oxygen atoms stay in
        the new substance, so the product weighs more than the steel wool did.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13862-01
    goal: KM13862
    type: numeric
    difficulty: 1
    prompt:
      nb: Et litiumatom har atomnummer 3. Hvor mange protoner har det i kjernen?
      en: A lithium atom has atomic number 3. How many protons does it have in
        its nucleus?
    answer: 3
    explanation:
      nb: Atomnummeret i periodesystemet forteller hvor mange protoner atomet
        har. Det er protontallet som bestemmer hvilket grunnstoff det er.
      en: The atomic number in the periodic table tells you how many protons the
        atom has. The proton count is what decides which element it is.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13862-02
    goal: KM13862
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvorfor reagerer edelgassene helt til høyre i periodesystemet nesten
        ikke med andre stoffer?
      en: Why do the noble gases on the far right of the periodic table hardly
        react with other substances?
    choices:
      - id: a
        text:
          nb: De har fullt ytterste elektronskall
          en: Their outermost electron shell is full
        correct: true
      - id: b
        text:
          nb: De er tyngre enn andre grunnstoffer
          en: They are heavier than other elements
      - id: c
        text:
          nb: De har ingen protoner i kjernen
          en: They have no protons in the nucleus
    explanation:
      nb: Kjemiske reaksjoner handler om elektronene i det ytterste skallet.
        Edelgassene har allerede fullt ytterskall og har derfor lite å vinne på
        å dele eller bytte elektroner.
      en: Chemical reactions are about the electrons in the outermost shell. The
        noble gases already have a full outer shell, so they have little to gain
        from sharing or swapping electrons.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13862-03
    goal: KM13862
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Natrium er et mykt metall som reagerer kraftig med vann, og klor er en
        giftig gass. Hva er natriumklorid, forbindelsen de danner sammen?
      en: Sodium is a soft metal that reacts violently with water, and chlorine
        is a poisonous gas. What is sodium chloride, the compound they form
        together?
    choices:
      - id: a
        text:
          nb: Vanlig salt, som vi bruker i mat
          en: Ordinary salt, the kind used in food
        correct: true
      - id: b
        text:
          nb: En gass som er like giftig som klor
          en: A gas just as poisonous as chlorine
      - id: c
        text:
          nb: Et metall som reagerer kraftig med vann
          en: A metal that reacts violently with water
    explanation:
      nb: En kjemisk forbindelse har egne egenskaper som ikke er en blanding av
        egenskapene til grunnstoffene. Natrium og klor danner natriumklorid,
        altså vanlig salt.
      en: A chemical compound has properties of its own, not a mixture of the
        properties of its elements. Sodium and chlorine form sodium chloride,
        ordinary table salt.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13863-01
    goal: KM13863
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hva beskriver drivhuseffekten best?
      en: Which of these best describes the greenhouse effect?
    choices:
      - id: a
        text:
          nb: Gasser i atmosfæren tar opp varmestråling fra jorda og sender noe
            av den tilbake
          en: Gases in the atmosphere absorb heat radiation from the Earth and
            send some of it back
        correct: true
      - id: b
        text:
          nb: Hull i ozonlaget slipper inn mer sollys
          en: Holes in the ozone layer let in more sunlight
      - id: c
        text:
          nb: Sola sender ut mer energi enn før
          en: The sun gives off more energy than it used to
    explanation:
      nb: Sollys varmer opp jordoverflata, som stråler varme ut igjen.
        Klimagasser som karbondioksid, metan og vanndamp tar opp en del av denne
        varmestrålingen og stråler den tilbake. Uten drivhuseffekten ville jorda
        vært langt kaldere. Ozonlaget er en annen sak, det stopper UV-stråling.
      en: Sunlight warms the surface, which radiates heat back out. Greenhouse
        gases such as carbon dioxide, methane and water vapour absorb some of
        that heat radiation and radiate it back. Without the greenhouse effect
        the Earth would be far colder. The ozone layer is a separate matter - it
        blocks UV radiation.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13863-02
    goal: KM13863
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilken menneskeskapt faktor bidrar mest til at mengden karbondioksid i
        atmosfæren har økt de siste 150 årene?
      en: Which human activity has contributed most to the rise in atmospheric
        carbon dioxide over the past 150 years?
    choices:
      - id: a
        text:
          nb: Forbrenning av fossilt brensel som kull, olje og gass
          en: Burning fossil fuels such as coal, oil and gas
        correct: true
      - id: b
        text:
          nb: Bruk av vannkraft
          en: Use of hydropower
      - id: c
        text:
          nb: Vulkanutbrudd
          en: Volcanic eruptions
    explanation:
      nb: Fossilt brensel er karbon som har ligget lagret i bakken i millioner av
        år. Når det brennes, går karbonet ut i atmosfæren som karbondioksid.
        Vulkaner slipper også ut CO2, men langt mindre enn menneskelig
        forbrenning, og vannkraft slipper ikke ut CO2 under drift.
      en: Fossil fuels are carbon that lay stored underground for millions of
        years. Burning them releases that carbon into the atmosphere as carbon
        dioxide. Volcanoes emit CO2 too, but far less than human combustion, and
        hydropower emits none while running.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13864-01
    goal: KM13864
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: En sykkellykt drives av en dynamo på hjulet. Hvilken energiomdanning
        skjer i dynamoen?
      en: A bicycle lamp is powered by a dynamo on the wheel. Which energy
        conversion happens in the dynamo?
    choices:
      - id: a
        text:
          nb: Bevegelsesenergi blir til elektrisk energi
          en: Kinetic energy becomes electrical energy
        correct: true
      - id: b
        text:
          nb: Elektrisk energi blir til bevegelsesenergi
          en: Electrical energy becomes kinetic energy
      - id: c
        text:
          nb: Kjemisk energi blir til lysenergi
          en: Chemical energy becomes light energy
    explanation:
      nb: Dynamoen drives rundt av hjulet og lager strøm, altså går
        bevegelsesenergi over til elektrisk energi. I lyspæra går den elektriske
        energien videre til lys og varme.
      en: The wheel turns the dynamo, which generates current, so kinetic energy
        becomes electrical energy. In the bulb that electrical energy goes on to
        become light and heat.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13864-02
    goal: KM13864
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: En lyspære bruker 100 J elektrisk energi og gir 10 J som lys. Hva
        skjedde med de siste 90 J?
      en: A light bulb uses 100 J of electrical energy and gives out 10 J as
        light. What happened to the other 90 J?
    choices:
      - id: a
        text:
          nb: De ble til varme, som er energi med lavere kvalitet
          en: They became heat, which is lower-quality energy
        correct: true
      - id: b
        text:
          nb: De forsvant helt
          en: They disappeared entirely
      - id: c
        text:
          nb: De ble lagret inne i pæra til neste gang
          en: They were stored inside the bulb for next time
    explanation:
      nb: Energi kan ikke forsvinne, bare gå over i andre former. Her spres 90 J
        som varme til omgivelsene. Varme som er spredt utover er vanskelig å
        bruke til noe nytt, og derfor sier vi at energikvaliteten er lav.
      en: Energy cannot disappear, only change form. Here 90 J spreads into the
        surroundings as heat. Heat that has spread out is hard to put to further
        use, which is why we call its energy quality low.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13865-01
    goal: KM13865
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Et vannkraftverk slipper ikke ut klimagasser når det er i drift. Hvilken
        miljøpåvirkning har utbygging av vannkraft likevel lokalt?
      en: A hydropower plant emits no greenhouse gases while running. What local
        environmental impact does building it still have?
    choices:
      - id: a
        text:
          nb: Elver og landskap endres, og leveområder for fisk og planter blir
            påvirket
          en: Rivers and landscapes are altered, affecting habitats for fish and
            plants
        correct: true
      - id: b
        text:
          nb: Lufta i området blir sur av svovel
          en: The air nearby turns acidic from sulphur
      - id: c
        text:
          nb: Det oppstår radioaktivt avfall
          en: Radioactive waste is produced
    explanation:
      nb: Ulike energikilder har ulike virkninger. Vannkraft gir ikke utslipp til
        lufta under drift, men demninger og rørgater endrer vannføringen i elva
        og landskapet rundt. Sur nedbør kommer fra svovel i fossilt brensel, og
        radioaktivt avfall kommer fra kjernekraft.
      en: Different energy sources have different effects. Hydropower emits
        nothing to the air while running, but dams and pipelines change a
        river's flow and the landscape around it. Acid rain comes from sulphur
        in fossil fuels, and radioactive waste comes from nuclear power.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13866-01
    goal: KM13866
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilken observasjon var viktig for Darwin da han utviklet
        evolusjonsteorien?
      en: Which observation was important to Darwin as he developed the theory of
        evolution?
    choices:
      - id: a
        text:
          nb: Beslektede arter på ulike øyer hadde ulike trekk som passet til
            maten der
          en: Related species on different islands had different traits suited to
            the food available there
        correct: true
      - id: b
        text:
          nb: Alle individer i en art er helt like
          en: All individuals of a species are exactly alike
      - id: c
        text:
          nb: Dyr endrer seg i løpet av livet og gir endringene videre
          en: Animals change during their lifetime and pass those changes on
    explanation:
      nb: Darwin la merke til at beslektede arter varierte fra sted til sted på
        måter som passet til miljøet. Variasjon mellom individer er selve
        forutsetningen for naturlig utvalg. At egenskaper man skaffer seg i løpet
        av livet arves, var en eldre idé som ikke holdt.
      en: Darwin noticed that related species varied from place to place in ways
        that matched their surroundings. Variation between individuals is the
        very basis of natural selection. The idea that traits acquired during
        life are inherited was an older one that did not hold up.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13866-02
    goal: KM13866
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: I et område blir bakkene mørkere av sot. Etter mange generasjoner er de
        fleste billene i området mørke, mens de før var lyse. Hva forklarer
        endringen best?
      en: In one area the ground turns darker with soot. After many generations
        most beetles there are dark, where before they were pale. What best
        explains the change?
    choices:
      - id: a
        text:
          nb: Mørke biller ble sjeldnere spist og fikk flere avkom, så genene
            deres ble vanligere
          en: Dark beetles were eaten less often and had more offspring, so their
            genes became more common
        correct: true
      - id: b
        text:
          nb: De lyse billene ble mørkere fordi de ville skjule seg
          en: The pale beetles turned darker because they wanted to hide
      - id: c
        text:
          nb: Sot festet seg til billene og farget dem
          en: Soot stuck to the beetles and coloured them
    explanation:
      nb: Naturlig utvalg virker på variasjon som allerede finnes i bestanden.
        Enkeltbiller endrer ikke farge etter behov, men de som tilfeldigvis var
        mørke, overlevde oftere og fikk flere avkom. Over generasjoner blir da
        mørk farge vanligere.
      en: Natural selection acts on variation already present in the population.
        Individual beetles do not change colour on demand, but the ones that
        happened to be dark survived more often and had more offspring, so over
        generations dark colouring became common.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13867-01
    goal: KM13867
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvilken celledel finnes i plantecellen, men ikke i dyrecellen?
      en: Which cell part is found in a plant cell but not in an animal cell?
    choices:
      - id: a
        text:
          nb: Kloroplast
          en: Chloroplast
        correct: true
      - id: b
        text:
          nb: Cellekjerne
          en: Nucleus
      - id: c
        text:
          nb: Cellemembran
          en: Cell membrane
    explanation:
      nb: Kloroplastene er der fotosyntesen skjer, og bare planteceller og noen
        alger har dem. Cellekjerne og cellemembran finnes i både plante- og
        dyreceller.
      en: Chloroplasts are where photosynthesis happens, and only plant cells and
        some algae have them. A nucleus and a cell membrane are found in both
        plant and animal cells.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13867-02
    goal: KM13867
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: En muskelcelle har mange flere mitokondrier enn en hudcelle. Hva
        forteller det om funksjonen til muskelcellen?
      en: A muscle cell has many more mitochondria than a skin cell. What does
        that tell you about the muscle cell's function?
    choices:
      - id: a
        text:
