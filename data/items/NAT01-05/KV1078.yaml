  - id: KM13874-02
    goal: KM13874
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: Hva menes med flokkimmunitet?
      en: What is meant by herd immunity?
    choices:
      - id: a
        text:
          nb: Når nok mennesker er immune, får smitten vanskelig for å spre seg,
            og også de som ikke kan vaksineres, beskyttes indirekte
          en: When enough people are immune, the infection struggles to spread,
            and those who cannot be vaccinated are protected indirectly
        correct: true
      - id: b
        text:
          nb: At immunforsvaret blir sterkere av å være mange sammen
          en: That the immune system grows stronger when people are together
      - id: c
        text:
          nb: At en vaksine gir immunitet til dem som står i nærheten
          en: That a vaccine gives immunity to those standing nearby
    explanation:
      nb: Et smittestoff trenger nye mottakelige personer for å spre seg videre.
        Er en stor nok andel immune, stopper smittekjedene opp. Det beskytter
        blant annet spedbarn og personer med svekket immunforsvar, som selv ikke
        kan ta alle vaksiner.
      en: A pathogen needs new susceptible people to keep spreading. If a large
        enough share of the population is immune, chains of transmission break.
        That protects infants and people with weakened immune systems, who cannot
        take every vaccine themselves.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.
not_assessable:
  - goal: KM13857
    reason: >-
      Asks the pupil to take part in risk assessments for experiments and follow
      the safety measures. Both halves are conduct in a lab, observed by a
      teacher over time. A written question could at best ask which safety rule
      is sensible, which tests neither participation nor compliance.

  - goal: KM13858
    reason: >-
      Asks for examples of current research and a discussion of how new
      knowledge is generated. "Dagsaktuell" means the material goes stale within
      months, so any fixed question would be wrong by the time a pupil met it,
      and the assessed part is the pupil's own discussion rather than a fact.

  - goal: KM13860
    reason: >-
      Asks the pupil to use programming to explore scientific phenomena. That is
      something done at a keyboard - writing, running and adjusting code. A quiz
      could ask what a printed program outputs, but that would test code
      reading, not the use of programming as an investigative tool.

  - goal: KM13875
    reason: >-
      Asks the pupil to give examples of and discuss current dilemmas around use
      of natural resources and loss of biodiversity. A dilemma has competing
      legitimate interests by definition; marking one side correct would present
      a contested policy question as settled science. The weighing is the goal,
      and it belongs in a classroom discussion, not a quiz key.
