# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.
not_assessable:
  - goal: KM13838
    reason: >-
      Asks the pupil to explore, build and program technological systems made of
      parts that work together. The whole goal is a making activity with a
      physical or coded result; a written question could only ask about
      technology in the abstract, which is a different skill.

  - goal: KM13839
    reason: >-
      Asks the pupil to design and make a product based on a user need. Design
      work is judged by the artefact and the process behind it, and no
      multiple-choice question can stand in for either.

  - goal: KM13840
    reason: >-
      Asks the pupil to reflect on how technology can solve challenges, create
      opportunities and lead to new dilemmas. A dilemma has no single correct
      answer by definition, so scoring one would mean rewarding a particular
      opinion rather than knowledge.

  - goal: KM13842
    reason: >-
      Asks the pupil to explore electric and magnetic forces through experiments
      and to talk about how we use electrical energy in everyday life. Both
      halves are practical or conversational; a question about circuits would
      test recall the goal does not ask for.
