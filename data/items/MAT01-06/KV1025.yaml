---
subject: MAT01-06
goal_set: KV1025

items:
  - id: KM13275-01
    goal: KM13275
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilket av tallene er størst?
      en: Which of these numbers is the largest?
    choices:
      - id: a
        text:
          nb: "0,45"
          en: "0.45"
      - id: b
        text:
          nb: "0,5"
          en: "0.5"
        correct: true
      - id: c
        text:
          nb: "0,289"
          en: "0.289"
    explanation:
      nb: Antall desimaler sier ingenting om størrelsen. Se på tidelene først.
        0,5 har 5 tideler, 0,45 har 4 og 0,289 har 2. Derfor er 0,5 størst.
      en: The number of decimals says nothing about size. Look at the tenths
        first. 0.5 has 5 tenths, 0.45 has 4 and 0.289 has 2, so 0.5 is largest.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13275-02
    goal: KM13275
    type: numeric
    difficulty: 3
    prompt:
      nb: På tallinjen står 3,4 og 3,5 ved siden av hverandre. Hvilket tall
        ligger midt mellom dem?
      en: On the number line, 3.4 and 3.5 sit next to each other. Which number
        lies halfway between them?
    answer: 3.45
    explanation:
      nb: Mellom 3,4 og 3,5 er det én tidel. Halvparten av en tidel er fem
        hundredeler, så tallet i midten er 3,45.
      en: There is one tenth between 3.4 and 3.5. Half a tenth is five
        hundredths, so the number in the middle is 3.45.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13276-01
    goal: KM13276
    type: numeric
    difficulty: 2
    prompt:
      nb: Regn ut 2,5 + 1,75.
      en: Work out 2.5 + 1.75.
    answer: 4.25
    explanation:
      nb: Skriv 2,5 som 2,50 så desimalene står under hverandre. 50 hundredeler
        pluss 75 hundredeler blir 125 hundredeler, altså 1,25. Til sammen 4,25.
      en: Write 2.5 as 2.50 so the decimals line up. 50 hundredths plus 75
        hundredths is 125 hundredths, or 1.25. Altogether that is 4.25.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13276-02
    goal: KM13276
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: Du vet at 12 · 4 = 48. Hva blir 1,2 · 4?
      en: You know that 12 × 4 = 48. What is 1.2 × 4?
    choices:
      - id: a
        text:
          nb: "0,48"
          en: "0.48"
      - id: b
        text:
          nb: "4,8"
          en: "4.8"
        correct: true
      - id: c
        text:
          nb: "48"
          en: "48"
    explanation:
      nb: 1,2 er ti ganger mindre enn 12. Da blir svaret også ti ganger mindre
        enn 48, altså 4,8. Regnestykket er det samme som for hele tall.
      en: 1.2 is ten times smaller than 12, so the answer is ten times smaller
        than 48, which is 4.8. The calculation works just like whole numbers.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13277-01
    goal: KM13277
    type: numeric
    difficulty: 2
    prompt:
      nb: Det er 25 elever i klassen. 20 prosent av dem sykler til skolen. Hvor
        mange elever sykler?
      en: There are 25 pupils in the class. 20 percent of them cycle to school.
        How many pupils cycle?
    answer: 5
    explanation:
      nb: 20 prosent er det samme som en femdel. En femdel av 25 er 25 delt på
        5, altså 5 elever.
      en: 20 percent is the same as one fifth. One fifth of 25 is 25 divided by
        5, which is 5 pupils.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13277-02
    goal: KM13277
    type: numeric
    difficulty: 3
    prompt:
      nb: En kanne rommer 1,5 liter saft. Klassen drikker en tredel av saften.
        Hvor mange liter er igjen?
      en: A jug holds 1.5 litres of squash. The class drinks one third of it.
        How many litres are left?
    answer: 1
    explanation:
      nb: En tredel av 1,5 liter er 0,5 liter. Da er det 1,5 minus 0,5 igjen,
        altså 1 liter. Du kan også tenke at to tredeler er igjen.
      en: One third of 1.5 litres is 0.5 litres, so 1.5 minus 0.5 is left, which
        is 1 litre. You can also think of it as two thirds remaining.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13278-01
    goal: KM13278
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilken egenskap har både et kvadrat og et rektangel?
      en: Which property do both a square and a rectangle have?
    choices:
      - id: a
        text:
          nb: Alle sidene er like lange
          en: All the sides are the same length
      - id: b
        text:
          nb: Alle fire hjørnene er rette
          en: All four corners are right angles
        correct: true
      - id: c
        text:
          nb: De har tre sider
          en: They have three sides
    explanation:
      nb: Begge figurene har fire rette hjørner. Det som skiller dem, er at
        kvadratet i tillegg har fire like lange sider.
      en: Both shapes have four right angles. What sets them apart is that the
        square also has four sides of equal length.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13278-02
    goal: KM13278
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: En figur har seks like store flater, og alle flatene er kvadrater.
        Hvilken figur er det?
      en: A solid has six identical faces, and every face is a square. Which
        solid is it?
    choices:
      - id: a
        text:
          nb: En terning
          en: A cube
        correct: true
      - id: b
        text:
          nb: En sylinder
          en: A cylinder
      - id: c
        text:
          nb: En pyramide
          en: A pyramid
    explanation:
      nb: Terningen er den eneste av disse som har seks kvadratiske flater. En
        sylinder har buede flater, og en pyramide har trekanter på sidene.
      en: The cube is the only one of these with six square faces. A cylinder
        has curved surfaces, and a pyramid has triangles on its sides.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13283-01
    goal: KM13283
    type: numeric
    difficulty: 2
    prompt:
      nb: Hvor mange symmetrilinjer har et kvadrat?
      en: How many lines of symmetry does a square have?
    answer: 4
    explanation:
      nb: Du kan brette kvadratet på midten loddrett og vannrett, og langs begge
        diagonalene. Det blir fire symmetrilinjer.
      en: You can fold a square in half vertically and horizontally, and along
        both diagonals. That makes four lines of symmetry.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13283-02
    goal: KM13283
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvilken bokstav har en loddrett symmetrilinje?
      en: Which letter has a vertical line of symmetry?
    choices:
      - id: a
        text:
          nb: "A"
          en: "A"
        correct: true
      - id: b
        text:
          nb: "F"
          en: "F"
      - id: c
        text:
          nb: "R"
          en: "R"
    explanation:
      nb: Bretter du A langs en loddrett linje i midten, passer halvdelene
        oppå hverandre. Det gjør de ikke for F og R.
      en: Fold an A along a vertical line down the middle and the two halves
        match. That does not happen with F or R.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13284-01
    goal: KM13284
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Et punkt ligger i (2, 3). Du flytter det 4 til høyre og 1 opp. Hvor
        havner punktet?
      en: A point sits at (2, 3). You move it 4 to the right and 1 up. Where
        does the point end up?
    choices:
      - id: a
        text:
          nb: (6, 4)
          en: (6, 4)
        correct: true
      - id: b
        text:
          nb: (2, 7)
          en: (2, 7)
      - id: c
        text:
          nb: (6, 2)
          en: (6, 2)
    explanation:
      nb: Førstekoordinaten viser hvor langt til høyre, så 2 pluss 4 blir 6.
        Andrekoordinaten viser hvor langt opp, så 3 pluss 1 blir 4.
      en: The first coordinate tells you how far right, so 2 plus 4 is 6. The
        second tells you how far up, so 3 plus 1 is 4.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13279-01
    goal: KM13279
    type: numeric
    difficulty: 1
    prompt:
      nb: En sirkel har en diameter på 10 cm. Hvor mange centimeter er radien?
      en: A circle has a diameter of 10 cm. How many centimetres is the radius?
    answer: 5
    explanation:
      nb: Diameteren går tvers over hele sirkelen, og radien går fra midten og
        ut. Radien er alltid halvparten av diameteren, altså 5 cm.
      en: The diameter crosses the whole circle, while the radius goes from the
        centre to the edge. The radius is always half the diameter, so 5 cm.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13279-02
    goal: KM13279
    type: numeric
    difficulty: 3
    prompt:
      nb: En sirkel har en diameter på 4 cm. Hvor lang er omkretsen i
        centimeter? Bruk pi lik 3,14.
      en: A circle has a diameter of 4 cm. How long is the circumference in
        centimetres? Use pi as 3.14.
    answer: 12.56
    tolerance: 0.05
    explanation:
      nb: Omkretsen er alltid pi ganger diameteren. 3,14 · 4 er 12,56 cm. Legg
        merke til at omkretsen er litt mer enn tre ganger diameteren.
      en: The circumference is always pi times the diameter. 3.14 × 4 is
        12.56 cm. Notice it is a little more than three times the diameter.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13280-01
    goal: KM13280
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvilken enhet passer best til å måle hvor mye vann det er i et badekar?
      en: Which unit fits best for measuring how much water is in a bathtub?
    choices:
      - id: a
        text:
          nb: Milliliter
          en: Millilitres
      - id: b
        text:
          nb: Liter
          en: Litres
        correct: true
      - id: c
        text:
          nb: Kvadratmeter
          en: Square metres
    explanation:
      nb: Et badekar rommer noen hundre liter. Milliliter blir altfor lite, og
        kvadratmeter måler areal, ikke volum.
      en: A bathtub holds a few hundred litres. Millilitres are far too small,
        and square metres measure area, not volume.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13280-02
    goal: KM13280
    type: numeric
    difficulty: 2
    prompt:
      nb: En eske er 5 cm lang, 3 cm bred og 2 cm høy. Hvor mange
        kubikkcentimeter er volumet?
      en: A box is 5 cm long, 3 cm wide and 2 cm tall. How many cubic
        centimetres is its volume?
    answer: 30
    explanation:
      nb: Volumet er lengde ganger bredde ganger høyde. 5 · 3 er 15, og 15 · 2
        er 30 kubikkcentimeter.
      en: Volume is length times width times height. 5 × 3 is 15, and 15 × 2 is
        30 cubic centimetres.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13285-01
    goal: KM13285
    type: numeric
    difficulty: 2
    prompt:
      nb: En skolehage er 12 m lang og 7 m bred. Du deler den i en del som er
        10 m lang og en del som er 2 m lang. Hva blir arealet til sammen i
        kvadratmeter?
      en: A school garden is 12 m long and 7 m wide. You split it into one part
        10 m long and one part 2 m long. What is the total area in square
        metres?
    answer: 84
    explanation:
      nb: Den ene delen er 10 · 7 er 70, den andre er 2 · 7 er 14. Til sammen
        84. Det er det samme som 12 · 7, for oppdelingen endrer ikke arealet.
      en: One part is 10 × 7 = 70, the other is 2 × 7 = 14, giving 84 in total.
        That equals 12 × 7, because splitting it up does not change the area.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13281-01
    goal: KM13281
    type: numeric
    difficulty: 2
    prompt:
      nb: En fotballbane i miniatyr er 8 m lang og 3 m bred. Hvor mange meter er
        omkretsen?
      en: A miniature football pitch is 8 m long and 3 m wide. How many metres
        is the perimeter?
    answer: 22
    explanation:
      nb: Omkretsen er alle fire sidene lagt sammen. Det er to sider på 8 m og
        to på 3 m, altså 16 pluss 6, som blir 22 m.
      en: The perimeter is all four sides added together. Two sides are 8 m and
        two are 3 m, so 16 plus 6 makes 22 m.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13281-02
    goal: KM13281
    type: numeric
    difficulty: 3
    prompt:
      nb: Et kvadrat har en omkrets på 20 cm. Hva er arealet i kvadratcentimeter?
      en: A square has a perimeter of 20 cm. What is its area in square
        centimetres?
    answer: 25
    explanation:
      nb: Kvadratet har fire like sider, så hver side er 20 delt på 4, altså
        5 cm. Arealet er 5 · 5, som blir 25 kvadratcentimeter.
      en: A square has four equal sides, so each side is 20 divided by 4, which
        is 5 cm. The area is 5 × 5, or 25 square centimetres.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

