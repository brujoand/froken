      tid og vurderes av en lærer som ser prosessen og produktet; ingen
      quizoppgave kan erstatte det.

  - goal: KM14682
    reason: >-
      Ber eleven reflektere over hvorfor konflikter oppstår og drøfte hvordan den
      enkelte og samfunnet kan håndtere dem. Årsakene til konflikt er omstridte,
      og hvordan de bør håndteres, er en drøfting uten ett fasitsvar. Å tvinge
