# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.
not_assessable:
  - goal: KM14201
    reason: >-
      Asks the pupil to describe and reflect on their own use of reading
      strategies. The object is the pupil's own metacognition, which only they
      have access to. A question could check whether they know what skumlesing
      means, but that would test terminology and quietly report it as evidence
      about their own reading.

  - goal: KM14198
    reason: >-
      Asks the pupil to explore and reflect on how texts portray young people's
      life situations. It requires reading a specific text and forming a
      considered response to it; there is no single correct answer, and asking
      one would either test a text the pupil has not read or present one reading
      as the right one.

  - goal: KM14186
    reason: >-
      Asks the pupil to use subject terminology and argue soberly in
      discussions, conversations, oral presentations and written work. The goal
      is performance in dialogue over time. A quiz can check that a pupil
      recognises a term, but not that they use it well while arguing with
      someone.

  - goal: KM14188
    reason: >-
      Asks the pupil to inform, narrate, argue and reflect in different oral and
      written genres, adapted to audience and medium. This is composition. No
      multiple-choice question can check whether a pupil can produce a text that
      fits its reader.

  - goal: KM14187
    reason: >-
      Asks the pupil to express themselves in different genres and experiment
      creatively with genre. Creative production has no correct answer to grade
      against, and a question about it would test genre knowledge instead of the
      making.

  - goal: KM14189
    reason: >-
      Asks the pupil to create composite texts and justify their choice of forms
      of expression. Both halves are activities: producing a text with images,
      sound or video, and explaining decisions the pupil themselves made.
      Neither survives being turned into a question with one right answer.
