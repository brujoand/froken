# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.
not_assessable:
  - goal: KM13380
    reason: >-
      Asks the pupil to use digital resources and other aids in language
      learning, text creation and interaction. Whether a pupil reaches for a
      dictionary, a spellchecker or a shared document is observable only while
      they work; a question could at best test what such a tool is, which is not
      what the goal asks for.

  - goal: KM13388
    reason: >-
      Concerns using central pronunciation patterns in communication. Speech
      cannot be captured by a written question, and the app grades typed and
      selected answers only. Testing spelling as a stand-in would measure a
      different skill and quietly misreport it as pronunciation.

  - goal: KM13373
    reason: >-
      Asks the pupil to ask questions and follow up what others say in
      conversations, adapted to purpose, audience and situation. Following up in
      a live conversation depends on what the other person just said, so no
      fixed question can check it; testing question word order instead would
      measure grammar, not interaction.

  - goal: KM13382
    reason: >-
      Asks the pupil to write formal and informal texts, including composite
      ones, with structure and coherence. Producing a text is exactly what a
      multiple-choice or one-word answer cannot do, and there is no model
      grading free writing at runtime.

  - goal: KM13383
    reason: >-
      Asks the pupil to revise their own texts on the basis of feedback. It
      presupposes a text the pupil wrote and feedback a teacher gave, neither of
      which exists inside a quiz.

  - goal: KM13386
    reason: >-
      Asks the pupil to explore and convey content from English-language
      cultural expressions in different media, tied to their own interests. The
      goal is deliberately open about which film, song, game or book the pupil
      chooses, so any question would have to pick one for them and would test
      familiarity with our choice rather than the skill.
