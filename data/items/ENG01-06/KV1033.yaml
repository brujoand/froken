  # KM13387 - ways of living, communication patterns and diversity
  - id: KM13387-01
    goal: KM13387
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: >-
        Du er på utveksling og vil be en medelev om å sende deg en bok. Hvilken
        formulering er den høfligste på engelsk?
      en: >-
        You are on an exchange and want to ask a classmate to pass you a book.
        Which wording is the most polite in English?
    choices:
      - id: a
        text:
          nb: Could you pass me the book, please?
          en: Could you pass me the book, please?
        correct: true
      - id: b
        text:
          nb: Give me the book.
          en: Give me the book.
      - id: c
        text:
          nb: I want the book now.
          en: I want the book now.
    explanation:
      nb: >-
        På engelsk pakkes forespørsler ofte inn i could you og please. Norsk
        klarer seg oftere med en direkte imperativ uten at det virker uhøflig, så
        en direkte oversettelse fra norsk kan lyde brattere enn du mener.
      en: >-
        English usually wraps requests in could you and please. Norwegian more
        often manages with a plain imperative without sounding rude, so a direct
        translation from Norwegian can come across as blunter than you intend.
